name: ptc-chatbot

# Dedicated infra for THIS project only — separate container names, separate
# host ports, separate volumes, so it never collides or shares state with
# any other project's Docker containers on the same machine (master prompt
# section 14's Docker Compose path: Milvus standalone + etcd + MinIO + Attu
# + Redis).

services:
  etcd:
    container_name: ptc-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ptc_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: ptc-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ptc_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: ptc-milvus
    image: milvusdb/milvus:v2.3.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ptc_milvus_data:/var/lib/milvus
    ports:
      - "19531:19530"  # client port our app connects to (MILVUS_URI)
      - "19092:9091"   # metrics / health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s  # cold start is slow, don't flag unhealthy too early
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    container_name: ptc-attu
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3001:3000"  # browse vectors at http://localhost:3001
    depends_on:
      milvus:
        condition: service_healthy

  redis:
    container_name: ptc-redis
    image: redis:7-alpine
    ports:
      - "6380:6379"  # our app connects here (REDIS_PORT)
    volumes:
      - ptc_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  ptc_etcd_data:
  ptc_minio_data:
  ptc_milvus_data:
  ptc_redis_data:
